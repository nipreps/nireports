name: Build-Test-Deploy

on:
  push:
    branches:
      - main
      - maint/*
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - maint/*
  schedule:
    # 8am EST / 9am EDT Mondays
    - cron: '0 13 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force tox and pytest to use color
  FORCE_COLOR: true
  TEMPLATEFLOW_HOME: /tmp/templateflow

jobs:
  build:
    name: Build & verify package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: ${{ github.event_name != 'pull_request' }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        dependencies: [latest] # , pre]
        architecture: ['x64']
        latex: [false]
        include:
          # Test minimum dependencies on oldest supported Python
          - os: ubuntu-latest
            python-version: "3.10"
            dependencies: min
            latex: false
          # Enable latex to exercise code paths that can take advantage
          - os: ubuntu-latest
            python-version: "3"
            dependencies: latest
            latex: true
        exclude:
          # Do not test pre-releases for versions out of SPEC0
          - os: ubuntu-latest
            python-version: "3.10"
            dependencies: pre
          # If we re-enable Windows/Mac tests, add the following exclusions:
          # 32-bit is a Windows-only consideration
          # Only run 2 newest Python on Windows/Mac
          # Skip 32-bit Windows with Python 3.10+ (see #42)

    env:
      DEPENDS: ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/apt
          key: apt-cache-v0
          restore-keys: |
            apt-cache-v0
      - name: Install tex
        if: ${{ matrix.latex }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dvipng texlive texlive-latex-extra cm-super
      - name: Show latex availability
        run: |
          echo "LaTeX matrix flag: ${{ matrix.latex }}"
          which latex || true
          latex --version || true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install webp and svgo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp
          npm install -g svgo

      - name: Restore cached templateflow
        id: tf-cache-restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/templateflow
          key: templateflow-v4
          # Fall back to and build on v3
          # If the cache need to be cleared, remove this when bumping key version
          restore-keys: |
            templateflow-v3
      - name: Pre-fetch templates
        run: |
          uv pip install --system templateflow
          python <<END
          from templateflow.api import get
          get('Fischer344', desc=None, suffix='T2w')
          get('MNI152NLin6Asym', resolution=2, desc='LR', suffix='T1w')
          get('MNI152NLin2009aAsym', resolution=1, desc='brain', suffix='mask')
          get('MNI152NLin2009aAsym', resolution=1, suffix='T1w')
          get('MNI152NLin2009aAsym', resolution=1, label='WM', suffix='probseg')
          get('fsLR', density='32k', suffix='inflated', extension=['.surf.gii'])
          END
        if: steps.tf-cache-restore.outputs.cache-hit != 'true'

      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        run: tox -v --exit-and-dump-after 1200
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ always() }}

  publish:
    name: Publish released package to pypi.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  checks:
    runs-on: 'ubuntu-latest'
    continue-on-error: true
    strategy:
      matrix:
        check: ['style', 'spellcheck', 'typecheck']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install tox
        run: uv tool install tox --with=tox-uv
      - name: Show tox config
        run: tox c
      - name: Show tox config (this call)
        run: tox c -e ${{ matrix.check }}
      - name: Run check
        run: tox -e ${{ matrix.check }}
